[workspace]
resolver = "2"
members = [
    "crates/umdf-core",
    "crates/umdf-cli",
    "crates/umdf-ui",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"
authors = ["Juan Pedro Paredes Caballero <juanpedro.paredes@gmail.com>"]
repository = "https://github.com/juampe/umdf"
homepage = "https://github.com/juampe/umdf"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
image = "0.25"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
trash = "5"
walkdir = "2"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
