[workspace]
resolver = "2"
members = [
    "crates/umdf-core",
    "crates/umdf-cli",
    "crates/umdf-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["UMDF contributors"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
image = "0.25"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
trash = "5"
walkdir = "2"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
