[package]
name = "umdf-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Slint desktop UI for the Universal Media Duplicate Finder"

[[bin]]
name = "umdf-ui"
path = "src/main.rs"

[features]
embeddings = ["umdf-core/embeddings"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
rayon.workspace = true
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
serde.workspace = true
serde_json.workspace = true
toml = "1"
ureq = "2"
dirs = "6"
slint = { version = "1.18", features = ["unstable-fontique-011"] }
trash.workspace = true
umdf-core = { path = "../umdf-core" }

[dev-dependencies]
image.workspace = true

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
