[package]
name = "umdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core engine for the Universal Media Duplicate Finder (UMDF)"

[features]
default = []
# Optional semantic similarity with ONNX Runtime (CUDA/CPU).
embeddings = ["dep:ort"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
kamadak-exif.workspace = true
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = [
    "std",
    "load-dynamic",
    "cuda",
    "api-31",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
trash.workspace = true
walkdir.workspace = true
rayon.workspace = true
